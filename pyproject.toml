[project]
name = "semiconductor-intelligence-hub"
version = "1.2.0"
description = "Azure Data Copilot — FastAPI backend + React frontend"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "groq>=0.9.0",
]

[tool.vercel]
entrypoint = "backend.main:app"

[tool.vercel.scripts]
build = "python scripts/vercel_build.py"
