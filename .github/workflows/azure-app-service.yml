# Build React (Vite) + deploy FastAPI to Azure App Service (Linux, Python 3.11).
# Frontend builds to frontend/dist; FastAPI (backend.main:app) serves it.
# Secrets stay in App Service Application Settings — never in Vite or this repo.
#
# GitHub OIDC secrets (existing):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#
# App Service Application Settings (portal only — not in Actions):
#   APP_ENV=production, GROQ_API_KEY, SQL_SERVER, SQL_DATABASE,
#   SQL_USERNAME, SQL_PASSWORD
# Startup Command: bash startup.sh

name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  AZURE_WEBAPP_NAME: semiconductor-ai-sanjana

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check package.json / package-lock.json sync
        working-directory: frontend
        run: |
          set -euo pipefail
          echo "::group::Lockfile sync check"
          python <<'PY'
          import json
          from pathlib import Path

          pkg = json.loads(Path("package.json").read_text(encoding="utf-8"))
          lock = json.loads(Path("package-lock.json").read_text(encoding="utf-8"))
          root = lock.get("packages", {}).get("", {})
          issues = []

          if pkg.get("name") != lock.get("name"):
              issues.append(f"top-level name: package.json={pkg.get('name')} lock={lock.get('name')}")
          if pkg.get("version") != lock.get("version"):
              issues.append(
                  f"top-level version: package.json={pkg.get('version')} lock={lock.get('version')}"
              )
          if pkg.get("name") != root.get("name"):
              issues.append(
                  f"packages[''].name: package.json={pkg.get('name')} lock={root.get('name')}"
              )
          if pkg.get("version") != root.get("version"):
              issues.append(
                  f"packages[''].version: package.json={pkg.get('version')} lock={root.get('version')}"
              )

          for section in ("dependencies", "devDependencies"):
              a = pkg.get(section) or {}
              b = root.get(section) or {}
              for key in sorted(set(a) | set(b)):
                  if a.get(key) != b.get(key):
                      issues.append(
                          f"{section}.{key}: package.json={a.get(key)} lock={b.get(key)}"
                      )

          if issues:
              print("package.json and package-lock.json are out of sync:")
              for issue in issues:
                  print(f" - {issue}")
              raise SystemExit(1)

          print("package.json and package-lock.json are in sync.")
          PY
          echo "::endgroup::"

      - name: Install frontend dependencies (npm ci)
        id: npm_ci
        working-directory: frontend
        run: |
          set -euo pipefail
          echo "::group::npm ci"
          npm ci
          echo "::endgroup::"

      - name: Build frontend (production)
        id: npm_build
        working-directory: frontend
        env:
          # Same-origin /api/... — never bake secrets into the client bundle
          VITE_API_BASE_URL: ""
        run: |
          set -euo pipefail
          echo "::group::npm run build"
          npm run build
          echo "::endgroup::"

      - name: Verify frontend/dist/index.html
        id: verify_dist
        run: |
          set -euo pipefail
          echo "::group::Verify frontend dist"
          if [[ ! -f frontend/dist/index.html ]]; then
            echo "ERROR: frontend/dist/index.html is missing after build."
            ls -la frontend/dist || true
            exit 1
          fi
          echo "frontend/dist/index.html OK"
          ls -la frontend/dist
          echo "::endgroup::"

      - name: Validate Python requirements (syntax / import surface)
        id: pip_check
        run: |
          set -euo pipefail
          echo "::group::Python requirements check"
          python -m pip install --upgrade pip
          # Do NOT build antenv here — Azure App Service Oryx installs requirements.txt.
          # Only validate that requirements parse; avoid compiling pyodbc on the runner
          # (needs unixodbc-dev and is unnecessary when Oryx installs on App Service).
          python - <<'PY'
          from pathlib import Path
          text = Path("requirements.txt").read_text(encoding="utf-8")
          reqs = [
              line.strip()
              for line in text.splitlines()
              if line.strip() and not line.strip().startswith("#")
          ]
          print("requirements.txt entries:")
          for req in reqs:
              print(f"  - {req}")
          if not reqs:
              raise SystemExit("requirements.txt has no installable entries")
          print("OK")
          PY
          echo "::endgroup::"

      - name: Assemble deployment package
        id: package
        run: |
          set -euo pipefail
          echo "::group::Assemble package"
          rm -rf _publish
          mkdir -p _publish/frontend

          cp -a backend _publish/backend
          cp -a ai _publish/ai
          cp -a frontend/dist _publish/frontend/dist
          cp requirements.txt _publish/requirements.txt
          cp startup.sh _publish/startup.sh
          cp runtime.txt _publish/runtime.txt

          # Strip bytecode / local junk (never ship secrets)
          find _publish -type d -name '__pycache__' -print0 | xargs -0 -r rm -rf
          find _publish -type d -name '.pytest_cache' -print0 | xargs -0 -r rm -rf
          find _publish -name '*.pyc' -delete
          rm -rf _publish/backend/static || true
          find _publish -name '.env' -type f -print0 | xargs -0 -r rm -f

          test -f _publish/frontend/dist/index.html
          test -f _publish/startup.sh
          test -f _publish/requirements.txt
          test -d _publish/backend
          test -d _publish/ai
          test ! -e _publish/antenv
          test ! -e _publish/.env

          echo "Package tree (depth 3):"
          find _publish -maxdepth 3 \( -type f -o -type d \) | sort | head -n 120
          echo "::endgroup::"

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: azure-app-package
          path: _publish
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    # Do NOT use a GitHub Environment here.
    # That would mint an OIDC subject like:
    #   repo:...:environment:Production
    # Azure Deployment Center federated credentials usually match the branch:
    #   repo:<owner>/<repo>:ref:refs/heads/main
    # Azure App Service slot "Production" is set via slot-name below (unrelated).

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: azure-app-package
          path: _publish

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: semiconductor-ai-sanjana
          slot-name: Production
          package: _publish
