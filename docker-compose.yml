services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sih-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_POWERBI_EMBED_URL: ${VITE_POWERBI_EMBED_URL:-}
        VITE_POWERBI_URL: ${VITE_POWERBI_URL:-https://app.powerbi.com/}
    container_name: sih-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
